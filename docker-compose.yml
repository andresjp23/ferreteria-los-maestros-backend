# Levanta solo MySQL para desarrollo local: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: ferreteria-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ferreteria
      MYSQL_USER: ${DB_USER:-ferreteria}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ferreteria}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: America/Santiago
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
