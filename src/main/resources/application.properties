spring.application.name=ferreteria-backend
server.port=${SERVER_PORT:8080}

# Variables locales opcionales en backend/.env (copiar desde .env.example)
spring.config.import=optional:file:.env[.properties]

# Base de datos MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ferreteria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:ferreteria}
spring.datasource.password=${DB_PASSWORD:ferreteria}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago

# JWT: la clave debe tener al menos 32 caracteres y no se sube al repositorio (va en .env)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-minutos=${JWT_EXPIRATION_MINUTES:60}

# CORS (orígenes separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
